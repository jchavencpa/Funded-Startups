name: Daily refresh
on:
  schedule: [{cron: "0 11 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  refresh:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python update.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data.json seen.json && (git diff --cached --quiet || git commit -m "daily refresh $(date -u +%F)") && git push
